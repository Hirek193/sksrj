name: Prerelease

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  BASE_VERSION: "1.0"
  KEEP_PRERELEASES: "10"

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        id: ver
        run: |
          echo "version=${BASE_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Sksrj.sln

      - name: Build
        run: dotnet build Sksrj.sln -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}

      - name: Smoke test – sample cards
        run: dotnet run --project tools/Sksrj.Cli -c Release --no-build -- --sample out/samples

      - name: Publish
        env:
          V: ${{ steps.ver.outputs.version }}
          SHORT: ${{ steps.ver.outputs.short }}
        run: |
          set -euo pipefail
          COMMON="-c Release -p:Version=$V -p:InformationalVersion=$V+$SHORT -p:DebugType=none"
          SINGLE="--self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true"
          dotnet publish src/Sksrj.App $COMMON -r win-x64 --self-contained false -o "out/SKSRJ-$V-win-x64"
          dotnet publish src/Sksrj.App $COMMON -r win-x64 $SINGLE -o "out/SKSRJ-$V-win-x64-standalone"
          dotnet publish src/Sksrj.App $COMMON -r linux-x64 $SINGLE -o "out/SKSRJ-$V-linux-x64"
          for d in out/SKSRJ-$V-*; do
            cp LICENSE ADDITIONAL_TERMS THIRD-PARTY-NOTICES.md README.md README.pl.md "$d"/
          done
          cd out
          zip -qr "SKSRJ-$V-win-x64.zip" "SKSRJ-$V-win-x64"
          zip -qr "SKSRJ-$V-win-x64-standalone.zip" "SKSRJ-$V-win-x64-standalone"
          tar -czf "SKSRJ-$V-linux-x64.tar.gz" "SKSRJ-$V-linux-x64"
          zip -qr "SKSRJ-$V-samples.zip" samples
          ls -la

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SKSRJ Timetable generator ${{ steps.ver.outputs.version }} (build ${{ steps.ver.outputs.short }})
          prerelease: true
          body: |
            Automatic build from branch `${{ github.ref_name }}`, commit ${{ github.sha }}.

            ${{ github.event.head_commit.message }}

            **Packages**
            - `win-x64` – Windows, requires the [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0) (x64); run `SKSRJ.exe`
            - `win-x64-standalone` – Windows, single `SKSRJ.exe`, no .NET installation needed
            - `linux-x64` – Linux, single `SKSRJ` executable
            - `samples` – sample project and PDF cards generated by this build

            Test build (prerelease). Licensed under GPL-3.0-or-later with additional terms – see `LICENSE` and `ADDITIONAL_TERMS`.
          files: |
            out/SKSRJ-${{ steps.ver.outputs.version }}-win-x64.zip
            out/SKSRJ-${{ steps.ver.outputs.version }}-win-x64-standalone.zip
            out/SKSRJ-${{ steps.ver.outputs.version }}-linux-x64.tar.gz
            out/SKSRJ-${{ steps.ver.outputs.version }}-samples.zip

      - name: Remove old prereleases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("build-")))] | sort_by(.createdAt) | reverse | .[env.KEEP_PRERELEASES | tonumber:] | .[].tagName' \
          | while read -r tag; do
              echo "Deleting $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done
